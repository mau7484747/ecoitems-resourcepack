name: Build combined server resource pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-pack.yml"
      - "scripts/refine_christmas_crate.py"
      - "BACKUP_WEIHNACHTSKISTE_TEXTURES/ORIGINAL_HIGH_DETAIL/weihnachtskiste.json"
      - "assets/minecraft/items/chest.json"
      - "assets/minecraft/atlases/items.json"
      - "assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste/**"
      - "assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste/**"

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-server-pack]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python for Christmas texture work
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Improve only the Christmas lanterns and close the hollow below the road
        shell: bash
        run: python3 scripts/refine_christmas_crate.py

      - name: Merge detailed Christmas crate into existing server pack
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import tempfile
          import zipfile
          from pathlib import Path

          repo = Path(".")
          archive = repo / "MAU_Spezialpapier_CMD_1001_1.21.11.zip"
          model_rel = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste/double_chest.json")
          texture_rel = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste")
          obsolete_model = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json")
          obsolete_texture = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png")
          chest_source = repo / "assets/minecraft/items/chest.json"
          atlas_source = repo / "assets/minecraft/atlases/items.json"

          for required in (archive, model_rel, texture_rel, chest_source, atlas_source):
              if not required.exists():
                  raise SystemExit(f"Required file is missing: {required}")

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8-sig"))

          with tempfile.TemporaryDirectory() as temp_name:
              work = Path(temp_name)
              with zipfile.ZipFile(archive, "r") as zin:
                  bad = zin.testzip()
                  if bad:
                      raise SystemExit(f"Original ZIP CRC check failed at: {bad}")
                  for info in zin.infolist():
                      member = Path(info.filename)
                      if member.is_absolute() or ".." in member.parts:
                          raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                      target = work / member
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(zin.read(info.filename))

              pack_meta = work / "pack.mcmeta"
              if not pack_meta.is_file():
                  raise SystemExit("Existing pack.mcmeta is missing.")
              pack_meta_before = pack_meta.read_bytes()
              blitz_model = work / "assets/minecraft/models/custom/maumod/maublitztruhe/double_chest.json"
              blitz_before = blitz_model.read_bytes() if blitz_model.is_file() else None

              # Replace Christmas-only model and texture assets.
              model_target = work / model_rel
              model_target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(repo / model_rel, model_target)
              texture_target = work / texture_rel
              if texture_target.exists():
                  shutil.rmtree(texture_target)
              shutil.copytree(repo / texture_rel, texture_target)
              pngs = sorted(texture_target.glob("*.png"))
              if len(pngs) < 20:
                  raise SystemExit(f"Incomplete texture set: only {len(pngs)} PNGs found.")
              for stale in (work / obsolete_model, work / obsolete_texture):
                  if stale.is_file():
                      stale.unlink()

              # Merge only the CMD 2000003 mapping.
              chest_target = work / "assets/minecraft/items/chest.json"
              source_chest = read_json(chest_source)
              christmas_entry = next((e for e in source_chest["model"]["entries"] if e.get("threshold") == 2000003), None)
              if christmas_entry is None or christmas_entry.get("model", {}).get("model") != "minecraft:custom/maumod/mausmp/weihnachtskiste/double_chest":
                  raise SystemExit("CMD 2000003 does not reference the restored Christmas model.")
              dest_chest = read_json(chest_target) if chest_target.exists() else source_chest
              dispatch = dest_chest["model"]
              if dispatch.get("type") != "minecraft:range_dispatch" or dispatch.get("property") != "minecraft:custom_model_data":
                  raise SystemExit("Existing chest.json is incompatible.")
              entries = dispatch.setdefault("entries", [])
              blitz_entry_before = next((e for e in entries if e.get("threshold") == 2000002), None)
              christmas_ids = [i for i,e in enumerate(entries) if e.get("threshold") == 2000003]
              if christmas_ids:
                  entries[christmas_ids[0]] = christmas_entry
                  for i in reversed(christmas_ids[1:]):
                      del entries[i]
              else:
                  entries.append(christmas_entry)
              entries.sort(key=lambda e: e.get("threshold", 0))
              if next((e for e in entries if e.get("threshold") == 2000002), None) != blitz_entry_before:
                  raise SystemExit("Blitztruhe CMD 2000002 changed unexpectedly.")
              chest_target.parent.mkdir(parents=True, exist_ok=True)
              chest_target.write_text(json.dumps(dest_chest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # Preserve every existing atlas source and ensure the MAUSMP directory is included.
              atlas_target = work / "assets/minecraft/atlases/items.json"
              source_atlas = read_json(atlas_source)
              christmas_atlas_source = next((s for s in source_atlas.get("sources", []) if s.get("type") == "minecraft:directory" and s.get("source") == "custom/maumod/mausmp/weihnachtskiste"), None)
              if christmas_atlas_source is None:
                  raise SystemExit("Christmas texture directory source is missing.")
              dest_atlas = read_json(atlas_target) if atlas_target.exists() else {"sources": []}
              sources = dest_atlas.setdefault("sources", [])
              if not any(s.get("type") == "minecraft:directory" and s.get("source") == christmas_atlas_source["source"] for s in sources):
                  sources.append(christmas_atlas_source)
              atlas_target.parent.mkdir(parents=True, exist_ok=True)
              atlas_target.write_text(json.dumps(dest_atlas, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # Validate every texture reference and the exact restored geometry.
              model_json = read_json(model_target)
              if len(model_json.get("elements", [])) < 400:
                  raise SystemExit("Expected the smaller reindeer, detailed sleigh, closed lower support and four-corner 3D lanterns.")
              front_uprights = (
                  ([-2.5, 5.5, 12.2], [-1.45, 18.5, 13.46]),
                  ([-2.71, 4.5, 11.99], [-1.24, 6.5, 13.67]),
                  ([17.45, 5.5, 12.2], [18.5, 18.5, 13.46]),
                  ([17.24, 4.5, 11.99], [18.71, 6.5, 13.67]),
              )
              if any(element.get("from") == frm and element.get("to") == to
                     for element in model_json.get("elements", [])
                     for frm,to in front_uprights):
                  raise SystemExit("One of the two circled front uprights is still in the model.")
              reindeer_textures = {"#fur", "#furLight", "#cream", "#antler", "#nose", "#hoof", "#harness", "#eye"}
              reindeer_elements = [
                  element for element in model_json.get("elements", [])
                  if any(face.get("texture") in reindeer_textures
                         for face in element.get("faces", {}).values())
              ]
              nose_count = sum(
                  1 for element in reindeer_elements
                  if any(face.get("texture") == "#nose" for face in element.get("faces", {}).values())
              )
              hoof_count = sum(
                  1 for element in reindeer_elements
                  if any(face.get("texture") == "#hoof" for face in element.get("faces", {}).values())
              )
              antler_count = sum(
                  1 for element in reindeer_elements
                  if any(face.get("texture") == "#antler" for face in element.get("faces", {}).values())
              )
              if len(reindeer_elements) != 40 or (nose_count, hoof_count, antler_count) != (1, 4, 12):
                  raise SystemExit(
                      f"Expected exactly one complete reindeer with four legs and antlers; "
                      f"found elements={len(reindeer_elements)}, noses={nose_count}, "
                      f"hooves={hoof_count}, antler_parts={antler_count}."
                  )
              min_x = min(element["from"][0] for element in reindeer_elements)
              max_x = max(element["to"][0] for element in reindeer_elements)
              min_y = min(element["from"][1] for element in reindeer_elements)
              max_y = max(element["to"][1] for element in reindeer_elements)
              min_z = min(element["from"][2] for element in reindeer_elements)
              max_z = max(element["to"][2] for element in reindeer_elements)
              if not (9.7 <= min_x and max_x <= 11.3 and 5.3 <= min_z and max_z <= 10.7):
                  raise SystemExit(
                      f"The single reindeer is not in the intended rotated position: "
                      f"x={min_x:.2f}..{max_x:.2f}, z={min_z:.2f}..{max_z:.2f}."
                  )
              if min_y < 9.15 or max_y > 14.5:
                  raise SystemExit("The reindeer legs or antlers are outside the display height.")
              if sum(1 for element in model_json.get("elements", [])
                     if any(face.get("texture") == "#glow" for face in element.get("faces", {}).values())) < 16:
                  raise SystemExit("The 3D lanterns must remain in place.")
              if "pillar" not in model_json.get("textures", {}) or "sleighCushion" not in model_json.get("textures", {}):
                  raise SystemExit("The new architectural pillar or sleigh upholstery texture mapping is missing.")
              if any(face.get("texture") == "#hole"
                     for element in model_json.get("elements", [])
                     for face in element.get("faces", {}).values()):
                  raise SystemExit("A flat lamp/bell sprite is still referenced by the Christmas model.")
              if not any(element.get("from") == [-0.28, 6.75, 4.38]
                         and abs(element.get("to", [0,0,0])[1] - 9.15) < 0.002
                         for element in model_json.get("elements", [])):
                  raise SystemExit("The solid fill does not reach the underside of the elk display floor.")
              if max(element["to"][1] for element in reindeer_elements) >= 14.0:
                  raise SystemExit("The two reindeer were not reduced to the requested smaller scale.")
              if not any(element.get("from") == [1.82, 9.27, 5.72]
                         for element in model_json.get("elements", [])):
                  raise SystemExit("The upgraded sleigh runner details are missing.")
              for key,value in model_json.get("textures", {}).items():
                  if not isinstance(value, str) or value.startswith("#"):
                      continue
                  namespace,location = value.split(":",1)
                  png = work / "assets" / namespace / "textures" / (location + ".png")
                  if not png.is_file():
                      raise SystemExit(f"Missing referenced texture: {png}")

              final_chest = read_json(chest_target)
              routes = final_chest["model"]["entries"]
              christmas = next((e for e in routes if e.get("threshold") == 2000003), None)
              blitz = next((e for e in routes if e.get("threshold") == 2000002), None)
              if christmas is None or christmas.get("model",{}).get("model") != "minecraft:custom/maumod/mausmp/weihnachtskiste/double_chest":
                  raise SystemExit("Christmas CMD route validation failed.")
              if blitz is None or blitz.get("model",{}).get("model") != "minecraft:custom/maumod/maublitztruhe/double_chest":
                  raise SystemExit("Blitztruhe CMD route validation failed.")
              if pack_meta.read_bytes() != pack_meta_before:
                  raise SystemExit("pack.mcmeta changed unexpectedly.")
              if blitz_before is not None and blitz_model.read_bytes() != blitz_before:
                  raise SystemExit("Blitztruhe model changed unexpectedly.")

              temp_zip = archive.with_suffix(".tmp.zip")
              with zipfile.ZipFile(temp_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
                  for file in sorted(work.rglob("*")):
                      if file.is_file():
                          zout.write(file, file.relative_to(work).as_posix())
              with zipfile.ZipFile(temp_zip, "r") as check:
                  bad = check.testzip()
                  if bad:
                      raise SystemExit(f"New ZIP CRC check failed at: {bad}")
                  names = set(check.namelist())
                  if model_rel.as_posix() not in names or "pack.mcmeta" not in names:
                      raise SystemExit("Required final ZIP files are missing.")
                  if obsolete_model.as_posix() in names or obsolete_texture.as_posix() in names:
                      raise SystemExit("Obsolete Christmas atlas files are still in the ZIP.")
                  for png in pngs:
                      if (texture_rel / png.name).as_posix() not in names:
                          raise SystemExit(f"Final ZIP is missing texture: {png.name}")
              temp_zip.replace(archive)
              print(f"Updated existing server pack: {archive}")
              print(f"Packed refined {len(model_json.get('elements', []))}-element Christmas model and {len(pngs)} separate PNG textures.")
              print("Preserved Blitztruhe CMD 2000002, model, pack.mcmeta and unrelated pack files.")
          PY

      - name: Commit updated server ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAU_Spezialpapier_CMD_1001_1.21.11.zip assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste/double_chest.json assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste scripts/refine_christmas_crate.py
          if git diff --cached --quiet; then
            echo "Server pack ZIP was already current."
          else
            git commit -m "Build server pack with smaller reindeer, detailed sleigh and 3D lanterns"
            git push origin HEAD:main
          fi
