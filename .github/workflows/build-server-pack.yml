name: Build combined server resource pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-server-pack.yml"
      - "assets/minecraft/items/chest.json"
      - "assets/minecraft/atlases/items.json"
      - "assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json"
      - "assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png"

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-server-pack]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Merge original Christmas crate into the existing server pack
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import tempfile
          import zipfile
          from pathlib import Path

          repo = Path(".")
          archive = repo / "MAU_Spezialpapier_CMD_1001_1.21.11.zip"

          model_rel = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json")
          texture_rel = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png")
          obsolete_model_rel = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste/double_chest.json")
          obsolete_texture_dir = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste")
          chest_source = repo / "assets/minecraft/items/chest.json"
          atlas_source = repo / "assets/minecraft/atlases/items.json"

          for required in (archive, model_rel, texture_rel, chest_source, atlas_source):
              if not required.is_file():
                  raise SystemExit(f"Required file is missing: {required}")

          with tempfile.TemporaryDirectory() as temp_name:
              work = Path(temp_name)
              with zipfile.ZipFile(archive, "r") as zin:
                  bad = zin.testzip()
                  if bad:
                      raise SystemExit(f"Original server ZIP failed CRC check at: {bad}")
                  for info in zin.infolist():
                      member = Path(info.filename)
                      if member.is_absolute() or ".." in member.parts:
                          raise SystemExit(f"Unsafe ZIP path rejected: {info.filename}")
                      target = work / member
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(zin.read(info.filename))

              # Remove the wrong Blitz-style model path and its newer folder textures.
              obsolete_model_target = work / obsolete_model_rel
              if obsolete_model_target.exists():
                  obsolete_model_target.unlink()
              obsolete_texture_target = work / obsolete_texture_dir
              if obsolete_texture_target.exists():
                  shutil.rmtree(obsolete_texture_target)

              # Install the original separate Christmas model and its single original atlas texture.
              model_target = work / model_rel
              texture_target = work / texture_rel
              model_target.parent.mkdir(parents=True, exist_ok=True)
              texture_target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(repo / model_rel, model_target)
              shutil.copy2(repo / texture_rel, texture_target)

              # Merge only CMD 2000003; keep the Blitztruhe route and all other chest entries.
              def load_json_clean(path):
                  raw = path.read_text(encoding="utf-8").strip()
                  while raw.endswith("\\n"):
                      raw = raw[:-2].rstrip()
                  return json.loads(raw)

              source_chest = load_json_clean(chest_source)
              new_entry = next(
                  (entry for entry in source_chest.get("model", {}).get("entries", [])
                   if entry.get("threshold") == 2000003),
                  None
              )
              if new_entry is None:
                  raise SystemExit("Source chest.json does not contain CMD 2000003.")

              chest_target = work / "assets/minecraft/items/chest.json"
              if chest_target.exists():
                  dest_chest = load_json_clean(chest_target)
                  model = dest_chest.get("model", {})
                  if model.get("type") != "minecraft:range_dispatch" or model.get("property") != "minecraft:custom_model_data":
                      raise SystemExit("Existing chest.json is incompatible; refusing to overwrite it.")
                  entries = model.setdefault("entries", [])
                  replaced = False
                  for i, entry in enumerate(entries):
                      if entry.get("threshold") == 2000003:
                          entries[i] = new_entry
                          replaced = True
                  if not replaced:
                      entries.append(new_entry)
                  entries.sort(key=lambda entry: entry.get("threshold", 0))
              else:
                  dest_chest = source_chest
              chest_target.parent.mkdir(parents=True, exist_ok=True)
              chest_target.write_text(json.dumps(dest_chest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # Restore the original parent-directory atlas source, preserving every unrelated source.
              source_atlas = load_json_clean(atlas_source)
              atlas_target = work / "assets/minecraft/atlases/items.json"
              if atlas_target.exists():
                  dest_atlas = load_json_clean(atlas_target)
              else:
                  dest_atlas = {"sources": []}
              sources = dest_atlas.setdefault("sources", [])
              sources[:] = [
                  item for item in sources
                  if not (item.get("type") == "minecraft:directory"
                          and item.get("source") == "custom/maumod/mausmp/weihnachtskiste")
              ]
              original_source = next(
                  (item for item in source_atlas.get("sources", [])
                   if item.get("type") == "minecraft:directory"
                   and item.get("source") == "custom/maumod/mausmp"),
                  None
              )
              if original_source is None:
                  raise SystemExit("Original Christmas atlas directory source is missing.")
              if not any(item.get("type") == "minecraft:directory"
                         and item.get("source") == original_source["source"]
                         for item in sources):
                  sources.append(original_source)
              atlas_target.parent.mkdir(parents=True, exist_ok=True)
              atlas_target.write_text(json.dumps(dest_atlas, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # Validate that the restored model and its original texture are both present.
              model_json = load_json_clean(model_target)
              for value in model_json.get("textures", {}).values():
                  if not isinstance(value, str) or value.startswith("#"):
                      continue
                  namespace, location = value.split(":", 1)
                  texture_file = work / "assets" / namespace / "textures" / (location + ".png")
                  if not texture_file.is_file():
                      raise SystemExit(f"Model texture is missing from merged pack: {texture_file}")

              if not (work / "pack.mcmeta").is_file():
                  raise SystemExit("Existing pack.mcmeta is missing; pack identity metadata was not changed.")

              temp_zip = archive.with_suffix(".tmp.zip")
              with zipfile.ZipFile(temp_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
                  for file in sorted(work.rglob("*")):
                      if file.is_file():
                          zout.write(file, file.relative_to(work).as_posix())

              with zipfile.ZipFile(temp_zip, "r") as check:
                  bad = check.testzip()
                  if bad:
                      raise SystemExit(f"New server ZIP failed CRC check at: {bad}")
                  names = set(check.namelist())
                  required_paths = {
                      model_rel.as_posix(),
                      texture_rel.as_posix(),
                      "assets/minecraft/items/chest.json",
                      "assets/minecraft/atlases/items.json",
                      "pack.mcmeta",
                  }
                  if not required_paths.issubset(names):
                      raise SystemExit("One or more required pack files are missing.")
                  if obsolete_model_rel.as_posix() in names:
                      raise SystemExit("Obsolete Blitz-style Christmas model path remains in the ZIP.")
              temp_zip.replace(archive)
              print(f"Updated existing server ZIP without changing its name or pack metadata: {archive}")
              print("Restored original 45-element Christmas model and original Christmas texture.")
              print("Preserved the existing resource-pack URL, pack.mcmeta and unrelated items.")

      - name: Commit updated server ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAU_Spezialpapier_CMD_1001_1.21.11.zip
          if git diff --cached --quiet; then
            echo "Server pack ZIP was already current."
          else
            git commit -m "Build server pack with original Christmas crate model"
            git push origin HEAD:main
          fi
