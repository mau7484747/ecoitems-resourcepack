name: Publish updated Christmas crate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-christmas-crate.yml"

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-christmas-crate]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build high-detail Christmas market stall model and update the existing pack
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, math, random, shutil, tempfile, zipfile
          from pathlib import Path
          from PIL import Image, ImageDraw

          ROOT = Path(".")
          MODEL_REL = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json")
          TEX_REL = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png")
          ZIP_REL = Path("MAU_Spezialpapier_CMD_1001_1.21.11.zip")
          MODEL_REL.parent.mkdir(parents=True, exist_ok=True)
          TEX_REL.parent.mkdir(parents=True, exist_ok=True)

          # Build a 512x512, sixteen-material atlas. Every 128px tile is a distinct
          # high-resolution material used by the independent Christmas crate.
          S = 128
          atlas = Image.new("RGBA", (512, 512), (0,0,0,0))
          rng = random.Random(24011)
          def tile(i, base):
              x, y = (i % 4)*S, (i // 4)*S
              im = Image.new("RGBA", (S,S), base)
              px = im.load()
              for yy in range(S):
                  for xx in range(S):
                      n = rng.randint(-7,7)
                      r,g,b,a = px[xx,yy]
                      px[xx,yy] = (max(0,min(255,r+n)),max(0,min(255,g+n)),max(0,min(255,b+n)),a)
              atlas.alpha_composite(im, (x,y))
              return ImageDraw.Draw(atlas), x, y

          # 0: carved burgundy cabinet doors.
          d,x,y = tile(0,(78,8,22,255))
          d.rectangle((5,5,122,122),outline=(225,164,70,255),width=5)
          d.rectangle((12,12,115,115),outline=(120,31,38,255),width=4)
          d.rectangle((19,20,108,109),fill=(95,8,25,255),outline=(185,111,48,255),width=3)
          d.rectangle((25,26,102,103),outline=(135,44,48,255),width=2)
          for cx in (15,113):
              d.ellipse((cx-4,58,cx+4,66),fill=(255,208,92,255),outline=(120,70,20,255))
          for yy in (35,44,88,97):
              d.line((29,yy,98,yy),fill=(117,25,35,255),width=1)

          # 1: deep-green horizontal timber.
          d,x,y = tile(1,(9,55,39,255))
          for yy in range(0,128,16):
              d.line((0,yy,127,yy),fill=(4,31,25,255),width=3)
              d.line((0,yy+3,127,yy+3),fill=(32,91,61,255),width=2)
              for xx in (12,53,94):
                  d.line((xx,yy+5,xx+12,yy+5),fill=(17,70,47,255),width=2)
                  d.ellipse((xx+2,yy+8,xx+4,yy+10),fill=(105,76,39,255))

          # 2: pale snow-covered timber boards.
          d,x,y = tile(2,(190,218,225,255))
          for yy in range(0,128,22):
              d.rectangle((0,yy,127,yy+18),fill=(192,220,227,255))
              d.line((0,yy+2,127,yy+2),fill=(242,250,251,255),width=3)
              d.line((0,yy+17,127,yy+17),fill=(132,168,180,255),width=2)
          for _ in range(60):
              xx,yy=rng.randrange(128),rng.randrange(128)
              d.ellipse((xx,yy,xx+2,yy+2),fill=(255,255,255,230))

          # 3: dark, slightly glossy roof shingles.
          d,x,y = tile(3,(46,51,66,255))
          for row in range(5):
              yy=5+row*24
              off=0 if row%2==0 else -14
              for col in range(5):
                  xx=off+col*30
                  d.rounded_rectangle((xx+2,yy,xx+29,yy+21),radius=4,fill=(65,72,88,255),outline=(19,25,38,255),width=3)
                  d.line((xx+5,yy+3,xx+24,yy+3),fill=(111,120,137,255),width=2)
                  d.point((xx+8,yy+8),fill=(126,133,147,255))

          # 4: red and snowy striped canopy fabric.
          d,x,y = tile(4,(151,13,31,255))
          for xx in range(0,128,32):
              d.rectangle((xx,0,xx+15,127),fill=(185,20,38,255))
              d.rectangle((xx+15,0,xx+31,127),fill=(228,232,224,255))
              d.line((xx,0,xx,127),fill=(94,5,18,255),width=2)
          d.line((0,8,127,8),fill=(255,245,225,255),width=4)
          d.line((0,119,127,119),fill=(105,12,24,255),width=4)

          # 5: fir garland with layered needles and berries.
          d,x,y = tile(5,(8,57,36,255))
          for row in range(6):
              yy=5+row*20
              for xx in range(-8,136,22):
                  d.polygon([(xx,yy+12),(xx+13,yy),(xx+28,yy+14),(xx+17,yy+12)],fill=(14,100,55,255),outline=(5,43,30,255))
                  d.line((xx+8,yy+10,xx+18,yy+3),fill=(61,133,70,255),width=2)
          for xx,yy in ((15,26),(50,47),(91,23),(110,83),(36,99),(75,112)):
              d.ellipse((xx-5,yy-5,xx+5,yy+5),fill=(196,16,34,255),outline=(255,183,76,255),width=2)

          # 6: brass supports, riveted metal and edge trim.
          d,x,y = tile(6,(174,112,34,255))
          d.rectangle((8,0,120,127),fill=(190,133,47,255),outline=(92,55,19,255),width=5)
          for xx in (18,38,58,78,98,112):
              d.line((xx,4,xx,124),fill=(242,197,93,255),width=3)
              for yy in (13,42,72,103,116):
                  d.ellipse((xx-3,yy-3,xx+3,yy+3),fill=(255,220,127,255),outline=(94,55,15,255))
          d.line((8,8,120,8),fill=(255,227,139,255),width=3)

          # 7: warm lantern glass with ornate brass frame.
          d,x,y = tile(7,(255,170,54,255))
          d.rectangle((9,7,119,121),fill=(104,48,22,255),outline=(255,203,93,255),width=7)
          d.rectangle((23,19,105,109),fill=(255,181,63,255),outline=(118,65,22,255),width=4)
          d.rectangle((35,27,93,101),fill=(255,207,105,255))
          d.line((42,30,42,98),fill=(255,239,178,255),width=4)
          d.ellipse((51,48,78,75),outline=(255,245,188,255),width=4)
          d.rectangle((12,0,116,8),fill=(240,190,86,255))
          d.rectangle((12,120,116,127),fill=(240,190,86,255))

          # 8: blue glass with reflections and gold frame.
          d,x,y = tile(8,(23,53,76,255))
          d.rectangle((7,7,120,120),outline=(224,183,95,255),width=6)
          d.rectangle((16,16,111,111),fill=(19,54,77,255),outline=(102,158,184,255),width=3)
          d.polygon([(24,100),(53,45),(79,100)],fill=(42,85,111,255))
          d.polygon([(57,101),(88,39),(107,101)],fill=(34,76,104,255))
          d.line((25,22,25,93),fill=(196,228,235,255),width=3)
          d.line((32,19,97,19),fill=(184,220,232,255),width=2)
          for xx,yy in ((88,33),(99,57),(71,76),(45,38)):
              d.ellipse((xx-2,yy-2,xx+2,yy+2),fill=(232,247,249,255))

          # 9: red wrapping paper.
          d,x,y = tile(9,(154,17,33,255))
          for yy in range(0,128,20):
              d.line((0,yy,127,yy),fill=(185,36,45,255),width=2)
          d.rectangle((54,0,73,127),fill=(243,197,81,255))
          d.rectangle((0,54,127,73),fill=(243,197,81,255))
          d.ellipse((31,14,66,47),outline=(255,221,136,255),width=6)
          d.ellipse((62,14,97,47),outline=(255,221,136,255),width=6)

          # 10: green wrapping paper.
          d,x,y = tile(10,(10,91,57,255))
          for yy in range(0,128,18):
              d.line((0,yy,127,yy),fill=(20,119,75,255),width=2)
          d.rectangle((55,0,73,127),fill=(241,218,153,255))
          d.rectangle((0,55,127,73),fill=(241,218,153,255))
          d.ellipse((32,14,66,47),outline=(255,237,189,255),width=6)
          d.ellipse((63,14,97,47),outline=(255,237,189,255),width=6)

          # 11: layered evergreen tree.
          d,x,y = tile(11,(6,72,43,255))
          d.polygon([(64,5),(28,55),(48,55),(17,91),(47,91),(5,119),(123,119),(81,91),(111,91),(80,55),(100,55)],fill=(8,104,55,255),outline=(2,41,27,255))
          d.line((64,12,64,111),fill=(94,148,70,255),width=3)
          for xx,yy in ((45,55),(75,68),(39,91),(87,98),(63,37)):
              d.ellipse((xx-4,yy-4,xx+4,yy+4),fill=(213,28,35,255),outline=(255,202,92,255),width=2)

          # 12: dark grey stone foundation.
          d,x,y = tile(12,(55,69,82,255))
          for row in range(4):
              yy=4+row*31
              off=0 if row%2==0 else -20
              for col in range(4):
                  xx=off+col*42
                  d.rounded_rectangle((xx+2,yy,xx+40,yy+27),radius=3,fill=(74,91,105,255),outline=(26,39,53,255),width=4)
                  d.line((xx+6,yy+4,xx+32,yy+4),fill=(119,140,153,255),width=2)

          # 13: large red satin bow.
          d,x,y = tile(13,(99,7,23,255))
          d.ellipse((9,25,64,82),fill=(177,12,35,255),outline=(79,3,17,255),width=5)
          d.ellipse((64,25,119,82),fill=(195,18,39,255),outline=(79,3,17,255),width=5)
          d.polygon([(53,69),(28,125),(49,112),(69,68)],fill=(205,20,43,255),outline=(87,2,18,255))
          d.polygon([(74,68),(91,124),(107,112),(91,64)],fill=(171,8,29,255),outline=(87,2,18,255))
          d.ellipse((49,44,79,76),fill=(247,191,83,255),outline=(116,56,21,255),width=4)

          # 14: fine snow, icy specks and snow trim.
          d,x,y = tile(14,(180,213,224,255))
          for yy in range(0,128,20):
              d.line((0,yy,127,yy),fill=(226,240,245,255),width=2)
          for _ in range(100):
              xx,yy=rng.randrange(128),rng.randrange(128)
              rr=rng.choice((1,2,3))
              d.ellipse((xx-rr,yy-rr,xx+rr,yy+rr),fill=(255,255,255,245))
          for xx,yy in ((24,25),(83,52),(45,94),(103,108)):
              d.line((xx-7,yy,xx+7,yy),fill=(255,255,255,255),width=2)
              d.line((xx,yy-7,xx,yy+7),fill=(255,255,255,255),width=2)

          # 15: shiny Christmas baubles.
          d,x,y = tile(15,(11,67,48,255))
          for cx,cy,col in ((30,42,(191,13,32,255)),(94,42,(246,184,54,255)),(62,95,(191,13,32,255))):
              d.ellipse((cx-23,cy-23,cx+23,cy+23),fill=col,outline=(255,223,142,255),width=4)
              d.ellipse((cx-12,cy-15,cx-3,cy-6),fill=(255,247,200,255))
          for cx,cy in ((26,96),(103,96),(62,18)):
              d.polygon([(cx,cy-9),(cx+3,cy-2),(cx+10,cy),(cx+3,cy+3),(cx,cy+10),(cx-3,cy+3),(cx-10,cy),(cx-3,cy-2)],fill=(255,205,98,255))

          atlas.save(TEX_REL)

          # Generate independent voxel geometry for the Christmas market stall.
          # Coordinates stay inside the standard 16x16x16 item model space.
          names = {'door':0,'green':1,'snowwood':2,'roof':3,'stripe':4,'garland':5,
                   'gold':6,'lantern':7,'glass':8,'giftred':9,'giftgreen':10,'tree':11,
                   'stone':12,'bow':13,'snow':14,'baubles':15}
          elements=[]
          def uv(mat):
              i=names[mat]; x=(i%4)*128; y=(i//4)*128
              return [x,y,x+128,y+128]
          def box(a,b,mat,rot=None,faces=None):
              f={}
              for side in ('north','south','east','west','up','down'):
                  f[side]={'uv':uv((faces or {}).get(side,mat)),'texture':'#atlas'}
              e={'from':list(a),'to':list(b),'faces':f}
              if rot: e['rotation']=rot
              elements.append(e)

          # Heavy stone foundation, trim and floor.
          box((.25,0,1),(15.75,.85,15),'stone')
          box((.2,.78,.65),(15.8,1.25,1.6),'snowwood')
          box((.35,.78,1),(.9,1.25,15),'stone')
          box((15.1,.78,1),(15.65,1.25,15),'stone')
          box((.8,1.15,1.45),(15.2,1.65,14.5),'green',faces={'up':'snowwood'})

          # Lower cabinet with paired red doors, brass frames and handles.
          box((1,1.55,1.35),(15,4.8,3.4),'green')
          box((1.35,1.7,.92),(14.65,4.35,1.5),'door')
          box((1.15,1.55,.72),(14.85,1.85,1.55),'gold')
          box((1.15,4.25,.72),(14.85,4.55,1.55),'gold')
          box((1.25,1.72,.65),(1.55,4.38,1.7),'gold')
          box((7.78,1.7,.62),(8.12,4.42,1.72),'gold')
          box((14.45,1.72,.65),(14.75,4.38,1.7),'gold')
          box((1.75,1.95,.78),(7.55,4.05,1),'door')
          box((8.45,1.95,.78),(14.25,4.05,1),'door')
          for x in (7.25,8.55):
              box((x,2.8,.54),(x+.24,3.55,.76),'gold')
              box((x+.02,3.08,.38),(x+.22,3.28,.58),'baubles')
          for x in (2,13.7):
              box((x,2.25,.55),(x+.22,3.8,.75),'gold')

          # Broad service counter with snowy top and red/gold edge.
          box((.75,4.55,1.1),(15.25,5.5,4.4),'green')
          box((.45,4.65,.55),(15.55,5.25,1.35),'stripe')
          box((.25,5.1,.45),(15.75,5.42,4.55),'gold')
          box((.38,5.32,.55),(15.62,5.62,4.55),'snowwood')

          # Enclosed sides, rear wall, framed side windows.
          box((.8,1.45,2.5),(1.55,11.85,14.15),'green')
          box((14.45,1.45,2.5),(15.2,11.85,14.15),'green')
          box((1.25,1.5,13.35),(14.75,11.8,14.05),'green')
          box((1.4,1.8,14),(14.6,4.7,14.2),'door')
          box((.65,1.8,3),(.85,4.7,13.65),'door')
          box((15.15,1.8,3),(15.35,4.7,13.65),'door')
          for sx in (.62,15.05):
              box((sx,6,5),(sx+.25,10.5,11.7),'glass')
              for z in (4.8,11.65):
                  box((sx-.08,5.8,z),(sx+.42,10.7,z+.28),'gold')
              for yy in (5.8,10.45):
                  box((sx-.08,yy,4.8),(sx+.42,yy+.28,11.95),'gold')
              box((sx-.05,5.9,8.15),(sx+.42,10.6,8.33),'gold')

          # Four strong front posts, inlaid gold and feet.
          for x in (.95,1.55,14.45,15.05):
              box((x,1.35,.95),(x+.35,12.5,1.55),'green')
              box((x+.08,1.55,.79),(x+.18,12.2,1),'gold')
              box((x-.06,1.25,.78),(x+.42,2.1,1.72),'gold')

          # Front display window, brass rails and counter shelf.
          box((1.15,11.1,.85),(14.85,11.85,1.65),'gold')
          box((1.65,10.75,.92),(14.35,11.2,1.52),'green')
          box((1.75,6,.92),(2.15,10.85,1.52),'gold')
          box((13.85,6,.92),(14.25,10.85,1.52),'gold')
          box((2.2,6.25,1.12),(13.8,10.65,1.26),'glass')
          box((2.1,6.05,1),(13.9,6.45,3.35),'snowwood')
          box((2,9.4,12.95),(14,9.75,13.25),'gold')
          for yy in (7.25,9.25):
              box((2,yy,12.5),(14,yy+.22,13.1),'gold')

          # Miniature evergreen trees and gift parcels in the display.
          for x in (3.25,11.95):
              box((x+.42,6.5,11.9),(x+.7,7.55,12.25),'gold')
              box((x,7.05,11.65),(x+1.55,8.45,12.5),'tree')
              box((x+.18,8.05,11.7),(x+1.38,9.25,12.45),'tree')
              box((x+.42,8.9,11.8),(x+1.12,9.95,12.35),'tree')
              box((x+.62,9.72,11.7),(x+.92,10.12,12.05),'baubles')
          for x,mat in ((5.15,'giftred'),(6.35,'giftgreen'),(8.25,'giftred'),(9.45,'giftgreen')):
              box((x,6.48,11.85),(x+.85,7.38,12.65),mat)
              box((x+.35,6.48,11.7),(x+.5,7.42,12.75),'gold')
              box((x+.18,7.36,11.9),(x+.68,7.65,12.45),'bow')

          # Cascading greenery, red berries and brass bells across the shop front.
          box((1.6,10.95,.45),(14.4,11.45,.86),'garland')
          for i in range(13):
              x=2+i*.98; yy=10.65-(.45 if i in (2,5,8,11) else .12 if i%2 else 0)
              box((x,yy,.38),(x+.62,yy+.52,.88),'garland')
          for x,yy in ((2.3,10.8),(4.5,10.5),(6.7,10.8),(8.9,10.5),(11.1,10.8),(13.3,10.5)):
              box((x,yy,.22),(x+.27,yy+.32,.54),'baubles')
          for x in (4,8,12):
              box((x,10.2,.33),(x+.38,10.55,.72),'gold')
              box((x-.08,9.85,.28),(x+.46,10.22,.78),'baubles')

          # Striped fabric valance underneath the roof.
          box((.8,11.75,.48),(15.2,12.35,1.15),'stripe')
          for x in (1.1,3.2,5.3,7.4,9.5,11.6,13.7):
              box((x,11.45,.4),(x+.9,11.9,.72),'gold')

          # Two warm hanging lanterns at the front corners.
          for x in (2.25,13.75):
              box((x+.22,10.75,.2),(x+.42,11.65,.42),'gold')
              box((x,9.95,.12),(x+.85,10.2,.82),'gold')
              box((x+.12,9.1,.22),(x+.73,9.98,.72),'lantern')
              box((x+.04,8.95,.14),(x+.81,9.18,.8),'gold')
              box((x+.3,10.15,.29),(x+.52,10.55,.51),'gold')

          # Wide pitched shingle roof. Two independent rotated panels meet at the ridge.
          box((7.55,14.85,.65),(8.45,15.45,15.35),'gold')
          box((.18,13,.7),(8.05,14,15.3),'roof',{'origin':[8,13.45,8],'axis':'z','angle':18,'rescale':True})
          box((7.95,13,.7),(15.82,14,15.3),'roof',{'origin':[8,13.45,8],'axis':'z','angle':-18,'rescale':True})
          box((.1,13.85,.48),(8.05,14.23,15.5),'snowwood',{'origin':[8,13.45,8],'axis':'z','angle':18,'rescale':True})
          box((7.95,13.85,.48),(15.9,14.23,15.5),'snowwood',{'origin':[8,13.45,8],'axis':'z','angle':-18,'rescale':True})

          # Gable fill, layered snow patches and festive peak bow at both ends.
          for z in (.72,14.45):
              box((.85,12,z),(15.15,12.7,z+.42),'green')
              box((3,12.65,z),(13,13.25,z+.42),'green')
              box((5.3,13.18,z),(10.7,13.78,z+.42),'door')
              box((7.1,13.62,z),(8.9,14.25,z+.42),'gold')
          snow_patches=((.75,13.35,1.35),(2.2,13.85,1.1),(4.05,14.25,1.05),
                        (6,14.62,1.1),(8,14.72,1.15),(10,14.62,1.1),
                        (11.95,14.25,1.05),(13.7,13.85,1.1),(15,13.35,.55))
          for x,yy,w in snow_patches:
              box((x,yy,.32),(x+w,yy+.24,1.18),'snow')
              box((x,yy,14.8),(x+w,yy+.24,15.55),'snow')
          box((6.9,14.15,.15),(7.9,14.72,.62),'bow')
          box((8.1,14.15,.15),(9.1,14.72,.62),'bow')
          box((7.68,14.25,.02),(8.32,14.78,.72),'baubles')

          # Roof side fascia, snow caps and extra garlands on both side elevations.
          box((.15,11.9,1.15),(.75,13.5,14.9),'gold')
          box((15.25,11.9,1.15),(15.85,13.5,14.9),'gold')
          box((.05,13.45,1.1),(.52,13.9,15),'snowwood')
          box((15.48,13.45,1.1),(15.95,13.9,15),'snowwood')
          for x1,x2,side in ((.38,.78,'l'),(15.22,15.62,'r')):
              for z in (4,6,8,10,12):
                  box((x1,10.55,z),(x2,11,z+1.1),'garland')
              for z in (5,9,13):
                  box((x1-.08,10.15,z),(x2+.08,10.72,z+.52),'bow')
                  box((x1-.08,8.55,z+.2),(x2+.08,9,z+.62),'baubles')

          # Small decorated fir planters and ornaments at the serving counter.
          for x in (2,12.9):
              box((x,5.62,1.2),(x+1.05,6.2,2.25),'gold')
              box((x-.15,6.05,1.3),(x+1.2,7.35,2.15),'tree')
              box((x+.05,7,1.38),(x+1,8.1,2.1),'tree')
              box((x+.33,7.8,1.48),(x+.72,8.6,1.98),'tree')
              box((x+.48,8.48,1.42),(x+.62,8.78,1.8),'baubles')
          for x in (5,7,9,11):
              box((x,5.65,2.6),(x+.36,6.05,2.98),'baubles')

          model = {
            'textures': {
              'atlas':'minecraft:custom/maumod/mausmp/weihnachtskiste',
              'particle':'minecraft:custom/maumod/mausmp/weihnachtskiste'
            },
            'elements':elements,
            'display': {
              'gui':{'rotation':[25,225,0],'translation':[0,0,0],'scale':[.63,.63,.63]},
              'ground':{'rotation':[0,0,0],'translation':[0,2,0],'scale':[.55,.55,.55]},
              'fixed':{'rotation':[0,0,0],'translation':[0,0,0],'scale':[.58,.58,.58]},
              'firstperson_righthand':{'rotation':[0,135,0],'translation':[0,2,0],'scale':[.46,.46,.46]},
              'firstperson_lefthand':{'rotation':[0,135,0],'translation':[0,2,0],'scale':[.46,.46,.46]},
              'thirdperson_righthand':{'rotation':[75,45,0],'translation':[0,2.5,0],'scale':[.42,.42,.42]},
              'thirdperson_lefthand':{'rotation':[75,45,0],'translation':[0,2.5,0],'scale':[.42,.42,.42]}
            }
          }
          MODEL_REL.write_text(json.dumps(model,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert len(elements) > 100, f"Model unexpectedly has only {len(elements)} elements"
          assert Image.open(TEX_REL).size == (512,512)

          # Replace only the Christmas crate model and texture entries in the existing ZIP.
          # Every unrelated archive entry is copied byte-for-byte, including Blitztruhe assets.
          if not ZIP_REL.is_file():
              raise SystemExit(f"Existing server pack is missing: {ZIP_REL}")
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              old=td/'old.zip'; new=td/'new.zip'
              shutil.copy2(ZIP_REL,old)
              replace={MODEL_REL.as_posix():MODEL_REL.read_bytes(),TEX_REL.as_posix():TEX_REL.read_bytes()}
              with zipfile.ZipFile(old,'r') as zin:
                  bad=zin.testzip()
                  if bad: raise SystemExit(f"Existing ZIP failed CRC check at {bad}")
                  old_names=set(zin.namelist())
                  if 'pack.mcmeta' not in old_names: raise SystemExit("Existing pack.mcmeta is missing")
                  with zipfile.ZipFile(new,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zout:
                      for info in zin.infolist():
                          if info.filename in replace: continue
                          zout.writestr(info,zin.read(info.filename))
                      for name,data in replace.items(): zout.writestr(name,data)
              with zipfile.ZipFile(new,'r') as z:
                  bad=z.testzip()
                  if bad: raise SystemExit(f"Updated ZIP CRC failure at {bad}")
                  names=set(z.namelist())
                  if not set(replace).issubset(names): raise SystemExit("New model or texture not in ZIP")
                  if 'pack.mcmeta' not in names: raise SystemExit("pack.mcmeta not preserved")
                  if 'assets/minecraft/items/chest.json' not in names: raise SystemExit("chest item mapping missing")
                  if 'assets/minecraft/models/custom/maumod/maublitztruhe/double_chest.json' not in names:
                      raise SystemExit("Blitztruhe model unexpectedly missing")
              new.replace(ZIP_REL)

          print(f"Generated independent market-stall model with {len(elements)} 3D elements.")
          print("Generated fresh 512x512 Christmas atlas.")
          print("Updated only the Christmas model and texture inside the existing server ZIP.")
          print("Preserved pack.mcmeta, chest mapping, Blitztruhe and all unrelated ZIP entries.")
          PY

      - name: Commit the Christmas crate and refreshed existing server ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/reference-preview.yml __temporary_reference_preview.b64 .github/workflows/publish-christmas-crate.yml
          git add assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json
          git add assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png
          git add MAU_Spezialpapier_CMD_1001_1.21.11.zip
          git commit -m "Publish detailed 3D Christmas market stall crate"
          git push origin HEAD:main
