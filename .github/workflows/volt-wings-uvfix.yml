name: One-time Volt Wings UV correction

on:
  push:
    paths:
      - ".github/workflows/volt-wings-uvfix.yml"

permissions:
  contents: write

jobs:
  fix-volt-wings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resource pack
        uses: actions/checkout@v4

      - name: Correct Blockbench UV scale
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import struct
          import tempfile
          import zipfile
          from pathlib import Path

          pack_path = Path("MAU_Spezialpapier_CMD_1001_1.21.11.zip")
          model_path = "assets/minecraft/models/custom/elitecreatures/volt_wings/volt_wings.json"
          texture_path = "assets/minecraft/textures/custom/elitecreatures/volt_wings/volt_wings.png"
          expected_texture_sha256 = "c814ba4003ea0b08a53cb44e9a740f640aec1c0610f8fc8e44e6f8216da69a09"

          if not pack_path.is_file():
              raise SystemExit("Resource pack ZIP not found")

          with zipfile.ZipFile(pack_path, "r") as src:
              if src.testzip() is not None:
                  raise SystemExit("Source ZIP failed integrity check")
              entries = {name: src.read(name) for name in src.namelist()}

          if model_path not in entries or texture_path not in entries:
              raise SystemExit("Volt Wings model or PNG missing from pack")

          import hashlib
          texture_bytes = entries[texture_path]
          if hashlib.sha256(texture_bytes).hexdigest() != expected_texture_sha256:
              raise SystemExit("Volt Wings PNG is not the expected original release texture")
          if texture_bytes[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
              raise SystemExit("Volt Wings texture is not a valid PNG")
          width, height = struct.unpack(">II", texture_bytes[16:24])
          if (width, height) != (128, 128):
              raise SystemExit(f"Unexpected texture dimensions: {width}x{height}")

          model = json.loads(entries[model_path].decode("utf-8"))
          texture_size = model.get("texture_size")
          if texture_size != [32, 32]:
              raise SystemExit(f"Unexpected Blockbench texture_size: {texture_size!r}")

          ratio = 16.0 / max(texture_size)
          face_count = 0
          all_uv = []
          for element in model.get("elements", []):
              for face in element.get("faces", {}).values():
                  if "uv" in face:
                      face["uv"] = [round(float(value) * ratio, 5) for value in face["uv"]]
                      all_uv.extend(face["uv"])
                      face_count += 1

          if face_count == 0 or min(all_uv) < 0 or max(all_uv) > 8.0:
              raise SystemExit("UV range validation failed")

          model.pop("texture_size", None)
          entries[model_path] = json.dumps(model, ensure_ascii=False, indent=2).encode("utf-8")

          fd, temp_name = tempfile.mkstemp(suffix=".zip", dir=str(pack_path.parent))
          os.close(fd)
          try:
              with zipfile.ZipFile(temp_name, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as dst:
                  for name, data in entries.items():
                      dst.writestr(name, data)
              with zipfile.ZipFile(temp_name, "r") as check:
                  if check.testzip() is not None:
                      raise SystemExit("Corrected ZIP failed integrity check")
                  check_model = json.loads(check.read(model_path).decode("utf-8"))
                  if "texture_size" in check_model:
                      raise SystemExit("Blockbench-only texture_size field was not removed")
                  if check.read(texture_path) != texture_bytes:
                      raise SystemExit("Original Volt Wings PNG changed unexpectedly")
                  if "assets/minecraft/models/item/mau_op_drill_1001.json" not in check.namelist():
                      raise SystemExit("Existing drill model was lost")
                  if "assets/minecraft/items/netherite_horse_armor.json" not in check.namelist():
                      raise SystemExit("Horse armor item definition was lost")
              os.replace(temp_name, pack_path)
          finally:
              if os.path.exists(temp_name):
                  os.remove(temp_name)

          print(f"Corrected {face_count} face UV maps using scale {ratio}.")
          print(f"Original Volt Wings PNG retained: {width}x{height}, SHA-256 {expected_texture_sha256}")
          PY

      - name: Commit corrected resource pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAU_Spezialpapier_CMD_1001_1.21.11.zip
          git commit -m "Fix Volt Wings UV mapping for 128px texture"
          git push origin HEAD:main
