name: Update Christmas showcase crate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-christmas-showcase.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[update-christmas-showcase]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the festive voxel showcase and update only its existing ZIP entries
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, random, shutil, tempfile, zipfile
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path(".")
          model_path = Path("assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json")
          texture_path = Path("assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png")
          archive_path = Path("MAU_Spezialpapier_CMD_1001_1.21.11.zip")
          model_path.parent.mkdir(parents=True, exist_ok=True)
          texture_path.parent.mkdir(parents=True, exist_ok=True)

          # 512x512 atlas with sixteen detailed 128px materials.
          rng = random.Random(211126)
          atlas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          tile_size = 128
          def make_tile(index, base, variation=6):
              tx, ty = (index % 4) * tile_size, (index // 4) * tile_size
              tile = Image.new("RGBA", (tile_size, tile_size), base)
              pixels = tile.load()
              for yy in range(tile_size):
                  for xx in range(tile_size):
                      r, g, b, a = pixels[xx, yy]
                      n = rng.randint(-variation, variation)
                      pixels[xx, yy] = (max(0,min(255,r+n)), max(0,min(255,g+n)),
                                        max(0,min(255,b+n)), a)
              draw = ImageDraw.Draw(tile)
              atlas.alpha_composite(tile, (tx, ty))
              return draw, tx, ty

          # 0 - deep red velvet, with raised vertical ribs and shaded channels.
          d,x,y = make_tile(0, (110, 5, 23, 255), 8)
          for xx in range(0,128,10):
              d.rectangle((xx,0,xx+5,127), fill=(151,10,31,255))
              d.line((xx+6,0,xx+6,127), fill=(58,2,15,255), width=2)
              d.line((xx+3,0,xx+3,127), fill=(196,33,47,255), width=1)
          d.line((0,8,127,8), fill=(194,36,49,255), width=2)
          d.line((0,119,127,119), fill=(47,2,12,255), width=3)

          # 1 - crimson roof tiles, darker seams and small highlights.
          d,x,y = make_tile(1, (120, 7, 25, 255), 7)
          for row in range(6):
              yy = row * 22 + 3
              off = 0 if row % 2 == 0 else -16
              for col in range(6):
                  xx = off + col*28
                  d.rounded_rectangle((xx+2, yy, xx+28, yy+19), radius=3,
                                      fill=(148,12,31,255), outline=(54,2,15,255), width=3)
                  d.line((xx+5, yy+3, xx+23, yy+3), fill=(211,59,64,255), width=2)
                  d.point((xx+9, yy+8), fill=(231,92,82,255))

          # 2 - white-blue snow blocks, layered snow strata and icy grain.
          d,x,y = make_tile(2, (202,224,233,255), 5)
          for yy in range(0,128,18):
              d.rectangle((0,yy,127,yy+15), fill=(207,228,236,255))
              d.line((0,yy+1,127,yy+1), fill=(250,255,255,255), width=3)
              d.line((0,yy+15,127,yy+15), fill=(151,184,198,255), width=2)
          for _ in range(85):
              xx,yy = rng.randrange(128),rng.randrange(128)
              rr = rng.choice((1,1,2,3))
              d.ellipse((xx-rr,yy-rr,xx+rr,yy+rr), fill=(255,255,255,240))

          # 3 - dark fir greenery with many voxel needles.
          d,x,y = make_tile(3, (7,55,34,255), 7)
          for row in range(7):
              yy = row*18+2
              for xx in range(-10,138,20):
                  d.polygon([(xx,yy+12),(xx+9,yy),(xx+20,yy+6),(xx+28,yy+16),(xx+15,yy+13)],
                            fill=(11,95,53,255), outline=(3,34,23,255))
                  d.line((xx+6,yy+10,xx+18,yy+4), fill=(45,132,69,255), width=2)
          for xx,yy in ((16,26),(44,48),(79,20),(105,76),(30,104),(91,111),(66,75)):
              d.ellipse((xx-4,yy-4,xx+4,yy+4), fill=(181,12,31,255), outline=(243,187,77,255), width=2)

          # 4 - aged gold trim and brass studs.
          d,x,y = make_tile(4, (167,111,35,255), 5)
          d.rectangle((5,5,122,122), fill=(188,137,49,255), outline=(80,48,17,255), width=5)
          d.rectangle((13,13,114,114), outline=(246,207,117,255), width=3)
          for xx in (21,45,69,93,108):
              d.line((xx,18,xx,110), fill=(229,181,79,255), width=3)
              for yy in (24,52,80,105):
                  d.ellipse((xx-3,yy-3,xx+3,yy+3), fill=(255,226,146,255),
                            outline=(93,56,19,255), width=1)
          d.line((13,13,114,13), fill=(255,233,165,255), width=3)

          # 5 - bright lantern glass, orange core and golden frame.
          d,x,y = make_tile(5, (255,171,54,255), 4)
          d.rectangle((8,7,120,121), fill=(115,57,20,255), outline=(255,207,99,255), width=7)
          d.rectangle((21,18,107,110), fill=(255,181,60,255), outline=(116,61,19,255), width=4)
          d.rectangle((34,28,94,100), fill=(255,220,123,255))
          d.line((41,31,41,95), fill=(255,246,192,255), width=4)
          d.line((86,30,86,96), fill=(255,197,78,255), width=3)
          d.ellipse((51,45,78,73), outline=(255,248,204,255), width=4)
          d.rectangle((10,0,118,8), fill=(226,171,70,255))
          d.rectangle((10,120,118,127), fill=(226,171,70,255))

          # 6 - icy glass with pale blue reflections and window framing.
          d,x,y = make_tile(6, (96,151,174,255), 4)
          d.rectangle((5,5,122,122), fill=(132,181,198,255), outline=(228,242,245,255), width=5)
          d.rectangle((13,13,114,114), fill=(103,157,179,255), outline=(45,94,120,255), width=3)
          d.polygon([(18,108),(51,20),(66,20),(38,108)], fill=(198,226,232,255))
          d.polygon([(74,108),(96,42),(107,42),(91,108)], fill=(155,201,217,255))
          d.line((21,20,21,104), fill=(239,250,251,255), width=3)
          d.line((30,17,97,17), fill=(218,240,245,255), width=2)

          # 7 - warm medium brown reindeer hide and wood.
          d,x,y = make_tile(7, (111,61,32,255), 7)
          for yy in range(0,128,20):
              d.line((0,yy,127,yy), fill=(78,39,23,255), width=2)
              d.line((0,yy+4,127,yy+4), fill=(151,86,45,255), width=2)
          for _ in range(48):
              xx,yy = rng.randrange(128),rng.randrange(128)
              d.point((xx,yy), fill=(179,111,61,255))
          d.rectangle((8,8,119,119), outline=(63,34,22,255), width=3)

          # 8 - dark antler wood, hooves and eyes.
          d,x,y = make_tile(8, (61,34,23,255), 5)
          for xx in range(0,128,16):
              d.line((xx,0,xx,127), fill=(91,53,34,255), width=3)
              d.line((xx+4,0,xx+4,127), fill=(36,22,17,255), width=2)
          d.rectangle((8,8,120,120), outline=(139,92,56,255), width=2)

          # 9 - gold bells with dark lower rims and bright reflections.
          d,x,y = make_tile(9, (190,127,29,255), 4)
          for cx in (35,93):
              d.rectangle((cx-12,20,cx+12,33), fill=(244,204,96,255), outline=(94,54,16,255), width=2)
              d.polygon([(cx-18,31),(cx+18,31),(cx+22,80),(cx+13,99),
                         (cx-13,99),(cx-22,80)], fill=(218,157,44,255), outline=(95,55,17,255))
              d.arc((cx-18,34,cx+18,89), 185, 355, fill=(255,228,135,255), width=4)
              d.ellipse((cx-4,94,cx+4,104), fill=(101,57,17,255))
              d.line((cx-10,45,cx-10,79), fill=(255,228,138,255), width=3)

          # 10 - sculpted red satin bows.
          d,x,y = make_tile(10, (124,4,23,255), 6)
          d.ellipse((7,25,63,82), fill=(188,12,37,255), outline=(72,1,15,255), width=5)
          d.ellipse((64,25,121,82), fill=(207,17,42,255), outline=(72,1,15,255), width=5)
          d.polygon([(54,65),(28,125),(48,113),(71,69)], fill=(211,22,47,255), outline=(75,1,15,255))
          d.polygon([(74,65),(93,125),(111,112),(91,65)], fill=(171,7,30,255), outline=(75,1,15,255))
          d.ellipse((48,43,80,78), fill=(245,189,76,255), outline=(103,49,15,255), width=4)
          d.line((20,48,48,54), fill=(252,97,97,255), width=3)
          d.line((81,54,109,47), fill=(252,97,97,255), width=3)

          # 11 - red-and-gold wrapping paper.
          d,x,y = make_tile(11, (145,9,27,255), 5)
          for yy in range(0,128,18):
              d.line((0,yy,127,yy), fill=(191,33,45,255), width=2)
          d.rectangle((53,0,74,127), fill=(233,186,73,255))
          d.rectangle((0,54,127,74), fill=(233,186,73,255))
          d.ellipse((27,12,65,48), outline=(255,223,140,255), width=6)
          d.ellipse((62,12,100,48), outline=(255,223,140,255), width=6)

          # 12 - layered fir tree branches with snow tips and ornaments.
          d,x,y = make_tile(12, (4,66,38,255), 6)
          d.polygon([(64,3),(27,55),(45,55),(13,89),(42,89),(3,122),(125,122),
                     (86,89),(115,89),(82,55),(101,55)], fill=(8,102,52,255),
                    outline=(2,35,23,255))
          for yy in (50,78,104):
              d.line((29,yy,60,yy+5), fill=(39,133,72,255), width=3)
              d.line((67,yy+5,98,yy), fill=(39,133,72,255), width=3)
          for xx,yy in ((43,65),(82,82),(53,101),(76,43)):
              d.ellipse((xx-4,yy-4,xx+4,yy+4), fill=(198,19,34,255),
                        outline=(255,206,93,255), width=2)
          for xx in (30,58,94):
              d.line((xx,45,xx+5,50), fill=(241,250,250,255), width=3)

          # 13 - pale snowy night backdrop with stars and flakes.
          d,x,y = make_tile(13, (112,158,183,255), 5)
          d.rectangle((0,0,127,127), fill=(132,178,197,255))
          d.polygon([(0,95),(25,60),(47,88),(74,48),(127,95),(127,127),(0,127)],
                    fill=(190,218,228,255))
          for _ in range(54):
              xx,yy = rng.randrange(128),rng.randrange(128)
              rr = rng.choice((1,2,3))
              d.ellipse((xx-rr,yy-rr,xx+rr,yy+rr), fill=(248,255,255,245))
          for xx,yy in ((17,20),(89,24),(57,60),(106,77),(34,103)):
              d.line((xx-5,yy,xx+5,yy), fill=(255,255,255,255), width=2)
              d.line((xx,yy-5,xx,yy+5), fill=(255,255,255,255), width=2)

          # 14 - dark green painted wood for frame and side panels.
          d,x,y = make_tile(14, (12,53,39,255), 5)
          for yy in range(0,128,16):
              d.line((0,yy,127,yy), fill=(5,31,26,255), width=3)
              d.line((0,yy+4,127,yy+4), fill=(31,82,59,255), width=2)
          d.rectangle((6,6,121,121), outline=(157,115,55,255), width=3)

          # 15 - blackened metal, dark stone and small decorative details.
          d,x,y = make_tile(15, (42,48,56,255), 5)
          for yy in range(0,128,24):
              d.line((0,yy,127,yy), fill=(24,30,38,255), width=3)
              d.line((0,yy+4,127,yy+4), fill=(75,83,91,255), width=2)
          for xx,yy in ((20,20),(108,20),(20,108),(108,108)):
              d.ellipse((xx-5,yy-5,xx+5,yy+5), fill=(196,145,55,255),
                        outline=(22,24,28,255), width=2)

          atlas.save(texture_path)

          # Model: 16-block-wide decorated gift-display stall with a deep open diorama.
          # Bounds fix: ornaments stay within the item cube; antler branches keep their full height.
          materials = {
              "velvet":0, "roof":1, "snow":2, "fir":3, "gold":4, "glow":5,
              "glass":6, "hide":7, "antler":8, "bell":9, "bow":10,
              "gift":11, "tree":12, "backdrop":13, "greenwood":14, "dark":15
          }
          elements = []
          def tile_uv(material):
              i = materials[material]
              xx, yy = (i % 4) * 128, (i // 4) * 128
              return [xx, yy, xx+128, yy+128]
          def box(a, b, material, rotation=None, face_materials=None):
              a = [float(v) for v in a]
              b = [float(v) for v in b]
              if any(b[i] <= a[i] for i in range(3)):
                  return
              if min(a) < -0.01 or max(b) > 16.01:
                  raise ValueError(f"Geometry outside 0..16: {a} -> {b}")
              fm = face_materials or {}
              faces = {}
              for side in ("north","south","east","west","up","down"):
                  faces[side] = {"uv": tile_uv(fm.get(side, material)), "texture":"#atlas"}
              element = {"from":a, "to":b, "faces":faces}
              if rotation:
                  element["rotation"] = rotation
              elements.append(element)
          def rod_xy(cx, cy, cz, length, thickness, depth, angle, material):
              box((cx-length/2,cy-thickness/2,cz-depth/2),
                  (cx+length/2,cy+thickness/2,cz+depth/2), material,
                  {"origin":[cx,cy,cz],"axis":"z","angle":angle,"rescale":True})
          def leaf(x, y, z, scale=1.0, material="fir"):
              box((x,y,z),(x+.42*scale,y+.28*scale,z+.34*scale),material)
          def bow_front(cx, cy, cz, size=1.0):
              # Block-built loops, knot and falling tails.
              box((cx-.83*size,cy-.17*size,cz),(cx-.17*size,cy+.48*size,cz+.42*size),"bow")
              box((cx+.17*size,cy-.17*size,cz),(cx+.83*size,cy+.48*size,cz+.42*size),"bow")
              box((cx-.22*size,cy-.22*size,cz-.04*size),(cx+.22*size,cy+.27*size,cz+.5*size),"gold")
              box((cx-.45*size,cy-.82*size,cz+.02*size),(cx-.12*size,cy-.15*size,cz+.4*size),"bow")
              box((cx+.12*size,cy-.82*size,cz+.02*size),(cx+.45*size,cy-.15*size,cz+.4*size),"bow")
          def side_bow(x, cy, cz, size=1.0, side="left"):
              lo=x-.1 if side=="left" else x-.32
              hi=x+.32 if side=="left" else x+.1
              # Silhouette on the side face (z is the running direction).
              box((lo,cy-.18*size,cz-.8*size),(hi,cy+.46*size,cz-.16*size),"bow")
              box((lo,cy-.18*size,cz+.16*size),(hi,cy+.46*size,cz+.8*size),"bow")
              box((lo-.04,cy-.2*size,cz-.18*size),(hi+.04,cy+.26*size,cz+.18*size),"gold")
              box((lo,cy-.82*size,cz-.44*size),(hi,cy-.12*size,cz-.12*size),"bow")
              box((lo,cy-.82*size,cz+.12*size),(hi,cy-.12*size,cz+.44*size),"bow")

          # Heavy lower box and the four snow-capped corner feet.
          box((.55,.55,.55),(15.45,5.2,15.45),"velvet")
          box((.25,.25,.25),(15.75,.72,15.75),"dark")
          for x0 in (.2,14.25):
              for z0 in (.2,14.25):
                  box((x0,.25,z0),(x0+1.55,1.35,z0+1.55),"snow")
                  box((x0+.18,.05,z0+.18),(x0+1.37,.45,z0+1.37),"velvet")
                  box((x0+.12,1.15,z0+.12),(x0+1.43,1.55,z0+1.43),"snow")
                  box((x0+.3,1.48,z0+.3),(x0+1.25,1.82,z0+1.25),"gold")
          # Pale continuous base rails along all sides.
          box((1.3,.72,.15),(14.7,1.12,.7),"snow")
          box((1.3,.72,15.3),(14.7,1.12,15.85),"snow")
          box((.15,.72,1.3),(.7,1.12,14.7),"snow")
          box((15.3,.72,1.3),(15.85,1.12,14.7),"snow")
          box((1.25,1.08,.18),(14.75,1.32,.62),"velvet")
          box((1.25,1.08,15.38),(14.75,1.32,15.82),"velvet")

          # Ribbed red velvet wrap: individual vertical raised ribs on front/back and sides.
          for i in range(14):
              xx=1.35+i*.96
              box((xx,1.38,.31),(xx+.48,5.12,1.28),"velvet")
              box((xx,1.38,14.72),(xx+.48,5.12,15.69),"velvet")
              box((xx+.5,1.55,.28),(xx+.58,4.96,.4),"bow")
              box((xx+.5,1.55,15.6),(xx+.58,4.96,15.72),"bow")
          for i in range(12):
              zz=1.42+i*1.08
              box((.31,1.38,zz),(1.28,5.12,zz+.48),"velvet")
              box((14.72,1.38,zz),(15.69,5.12,zz+.48),"velvet")
          # Corners with contrasting bright snow-white blocks and red posts.
          for x0 in (.72,14.42):
              for z0 in (.72,14.42):
                  box((x0,1.25,z0),(x0+.82,5.48,z0+.82),"greenwood")
                  box((x0-.12,1.35,z0-.12),(x0+.94,1.92,z0+.94),"snow")
                  box((x0-.12,4.98,z0-.12),(x0+.94,5.62,z0+.94),"snow")
          # Thick red-white moulding around top of the lower box.
          box((.25,5.03,.25),(15.75,5.46,.82),"velvet")
          box((.25,5.03,15.18),(15.75,5.46,15.75),"velvet")
          box((.25,5.03,.82),(.82,5.46,15.18),"velvet")
          box((15.18,5.03,.82),(15.75,5.46,15.18),"velvet")
          box((.18,5.42,.18),(15.82,5.72,.78),"snow")
          box((.18,5.42,15.22),(15.82,5.72,15.82),"snow")
          box((.18,5.42,.78),(.78,5.72,15.22),"snow")
          box((15.22,5.42,.78),(15.82,5.72,15.22),"snow")

          # Festive greenery garlands on the front and both sides, with red berries.
          box((1.25,5.57,.3),(14.75,6.05,.92),"fir")
          for i in range(28):
              xx=1.3+i*.49
              yy=5.42+(0.17 if i%2 else 0)
              leaf(xx,yy,.24,1.0,"fir")
              leaf(xx+.18,yy+.11,.48,.78,"fir")
              if i%3==0:
                  box((xx+.17,yy+.12,.12),(xx+.37,yy+.35,.35),"bow")
              if i%4==1:
                  box((xx+.29,yy+.12,.16),(xx+.47,yy+.34,.39),"gold")
          for side_x in (.22,15.28):
              box((side_x,5.57,1.25),(side_x+.5,6.05,14.75),"fir")
              for i in range(22):
                  zz=1.3+i*.61
                  box((side_x-.05,5.42,zz),(side_x+.55,5.88,zz+.38),"fir")
                  if i%4==0:
                      box((side_x-.1,5.52,zz+.12),(side_x+.62,5.82,zz+.34),"bow")

          # Large front bow with a pair of sculpted gold bells below it.
          bow_front(8,5.95,.13,1.05)
          for x0 in (7.25,8.7):
              box((x0,5.0,.15),(x0+.18,5.52,.4),"gold")
              box((x0-.2,4.18,.1),(x0+.42,5.03,.6),"bell")
          side_bow(.2,5.92,8,1.0,"left")
          side_bow(15.8,5.92,8,1.0,"right")
          for sx in (.08,15.54):
              for zz in (7.35,8.55):
                  box((sx,4.18,zz),(sx+.38,5.05,zz+.55),"bell")

          # Warm lit corner pilasters and light columns around the showcase.
          for x0 in (.85,14.8):
              for z0 in (.72,14.72):
                  box((x0,5.65,z0),(x0+.42,12.75,z0+.42),"gold")
                  for yy in (6.0,7.55,9.1,10.65,12.1):
                      box((x0-.12,yy,z0-.12),(x0+.56,yy+.64,z0+.56),"glow")
                      box((x0-.18,yy-.08,z0-.18),(x0+.62,yy+.05,z0+.62),"gold")
                      box((x0-.18,yy+.62,z0-.18),(x0+.62,yy+.75,z0+.62),"gold")
          # Additional slender gold uprights at the front edges.
          for xx in (1.25,14.35):
              box((xx,5.7,.82),(xx+.28,12.65,1.18),"gold")
              for yy in (6.2,8.3,10.4,12.0):
                  box((xx-.1,yy,.72),(xx+.42,yy+.52,1.3),"glow")

          # Showcase floor, rear wall and cool-toned side windows.
          box((1.2,6.05,1.25),(14.8,6.58,14.55),"snow")
          box((1.12,6.48,13.8),(14.88,12.35,14.48),"backdrop")
          box((1.18,6.52,13.55),(14.82,6.82,14.5),"snow")
          # Ice pillars and side glass panes.
          for x0 in (.72,14.88):
              box((x0,6.25,2.05),(x0+.42,12.45,13.95),"glass")
              for zz in (2.0,13.62):
                  box((x0-.12,6.18,zz),(x0+.62,12.58,zz+.32),"snow")
              for yy in (6.15,12.18):
                  box((x0-.12,yy,2.0),(x0+.62,yy+.3,13.96),"gold")
              for zz in (3.2,6.1,9.0,11.9):
                  box((x0-.08,6.35,zz),(x0+.58,12.25,zz+.12),"snow")
          # Back wall vertical architecture and icy columns.
          for xx in (1.35,4.25,7.15,10.05,12.95,14.25):
              box((xx,6.7,13.42),(xx+.26,12.2,13.72),"snow")
              box((xx+.07,6.85,13.34),(xx+.18,12.05,13.48),"glass")
          # Snowflakes and stars on the inside back wall.
          for xx,yy in ((2.3,10.8),(3.4,8.9),(5.8,11.3),(7.0,9.7),(9.2,11.2),
                        (11.4,9.2),(13.2,10.8),(4.5,7.5),(10.1,7.8),(12.2,11.7)):
              box((xx,yy,13.30),(xx+.12,yy+.12,13.46),"snow")
              box((xx-.12,yy+.04,13.30),(xx+.24,yy+.08,13.46),"snow")
              box((xx+.04,yy-.12,13.30),(xx+.08,yy+.24,13.46),"snow")

          # Two hanging lanterns within the miniature scene.
          for xx in (4.25,11.7):
              box((xx,11.7,4.0),(xx+.16,12.35,4.16),"gold")
              box((xx-.34,11.05,3.72),(xx+.5,11.8,4.48),"gold")
              box((xx-.22,10.45,3.84),(xx+.38,11.12,4.36),"glow")
              box((xx-.38,10.35,3.66),(xx+.54,10.52,4.54),"gold")
              box((xx-.38,11.72,3.66),(xx+.54,11.9,4.54),"gold")

          # Small snow-covered fir trees around the back of the showcase.
          def mini_tree(cx, z, base_y=6.58, scale=1.0):
              box((cx-.13*scale,base_y,z-.13*scale),(cx+.13*scale,base_y+1.2*scale,z+.13*scale),"antler")
              for j in range(3):
                  yy=base_y+.45*scale+j*.48*scale
                  width=(1.05-j*.23)*scale
                  box((cx-width/2,yy,z-.5*scale),(cx+width/2,yy+.55*scale,z+.5*scale),"tree")
                  box((cx-width/2+.08,yy+.43*scale,z-.53*scale),(cx+width/2-.08,yy+.62*scale,z+.53*scale),"snow")
              box((cx-.12,base_y+1.82*scale,z-.12),(cx+.12,base_y+2.02*scale,z+.12),"gold")
              for bx,by in ((cx-.25,base_y+1.05*scale),(cx+.2,base_y+1.48*scale)):
                  box((bx,by,z-.54*scale),(bx+.18,by+.2,z-.34*scale),"bow")
          mini_tree(2.65,11.4,.6,.78)
          mini_tree(13.15,11.3,.6,.78)
          mini_tree(7.7,12.25,.6,.62)

          # Red sleigh at the left: raised front, gold runners and ornate trim.
          box((3.0,6.9,6.7),(6.9,7.25,9.55),"gold")
          box((3.18,7.14,6.82),(6.72,8.12,9.38),"gift")
          box((3.0,7.25,6.65),(3.36,8.85,9.6),"velvet")
          box((6.48,7.22,6.65),(6.84,8.55,9.6),"velvet")
          box((3.28,8.03,6.72),(6.58,8.38,9.48),"bow")
          box((3.42,8.25,7.15),(6.42,8.58,9.0),"gold")
          # Sleigh's gold runners with curled-up voxel ends.
          for zz in (6.85,9.25):
              box((2.8,6.5,zz),(7.12,6.72,zz+.19),"gold")
              box((2.82,6.55,zz),(3.2,7.08,zz+.19),"gold")
              box((6.72,6.55,zz),(7.1,7.18,zz+.19),"gold")
              box((2.8,7.0,zz),(3.35,7.2,zz+.19),"gold")
          # Sleigh seat, back rail, gift sack and side decorations.
          box((3.55,8.35,7.0),(6.25,8.58,7.35),"velvet")
          box((3.52,8.5,7.0),(6.28,8.85,7.2),"gold")
          box((4.1,8.35,7.6),(5.35,9.15,8.85),"gift")
          box((4.36,9.05,7.92),(5.1,9.35,8.5),"bow")
          for xx in (3.48,6.08):
              box((xx,7.35,6.58),(xx+.18,8.02,6.72),"gold")
              box((xx,7.52,9.45),(xx+.18,8.1,9.62),"gold")

          # Two distinct reindeer: voxel body, raised neck, head, legs, harness and branching antlers.
          def reindeer(cx, zbase, scale=1.0):
              def b(a,bv,mat):
                  box(a,bv,mat)
              # body and rump
              b((cx-.55*scale,7.2,zbase),(cx+.55*scale,8.02,zbase+1.28*scale),"hide")
              b((cx-.43*scale,7.85,zbase+.18*scale),(cx+.43*scale,8.18,zbase+1.10*scale),"hide")
              b((cx-.49*scale,7.45,zbase+.05*scale),(cx-.25*scale,7.82,zbase+.22*scale),"antler")
              # forward-sloping neck and head facing the front of the display
              b((cx-.24*scale,7.72,zbase-.26*scale),(cx+.24*scale,8.85,zbase+.28*scale),"hide")
              b((cx-.32*scale,8.62,zbase-.43*scale),(cx+.32*scale,9.18,zbase+.12*scale),"hide")
              b((cx-.22*scale,8.67,zbase-.62*scale),(cx+.22*scale,8.93,zbase-.4*scale),"antler")
              # four small legs and dark hooves
              for dx in (-.37,.25):
                  for dz in (.12, .96):
                      b((cx+dx*scale,6.57,zbase+dz*scale),
                        (cx+(dx+.13)*scale,7.3,zbase+(dz+.14)*scale),"hide")
                      b((cx+(dx-.015)*scale,6.52,zbase+(dz-.02)*scale),
                        (cx+(dx+.15)*scale,6.72,zbase+(dz+.17)*scale),"antler")
              # red collar, gold harness and small nose/eyes
              b((cx-.27*scale,8.12,zbase-.17*scale),(cx+.27*scale,8.32,zbase+.05*scale),"bow")
              b((cx-.34*scale,7.7,zbase+.15*scale),(cx+.34*scale,7.88,zbase+1.1*scale),"gold")
              b((cx-.1*scale,8.75,zbase-.65*scale),(cx+.1*scale,8.9,zbase-.52*scale),"bow")
              b((cx-.31*scale,8.89,zbase-.45*scale),(cx-.21*scale,8.99,zbase-.35*scale),"dark")
              b((cx+.21*scale,8.89,zbase-.45*scale),(cx+.31*scale,8.99,zbase-.35*scale),"dark")
              # ears
              b((cx-.48*scale,8.92,zbase-.12*scale),(cx-.25*scale,9.18,zbase+.03*scale),"hide")
              b((cx+.25*scale,8.92,zbase-.12*scale),(cx+.48*scale,9.18,zbase+.03*scale),"hide")
              # branching antlers: upright trunks plus angled voxel tines
              for side in (-1,1):
                  ax=cx+side*.22*scale
                  b((ax-.09*scale,9.05,zbase-.1*scale),
                    (ax+.09*scale,10.05*scale,zbase+.08*scale),"antler")
                  rod_xy(ax+side*.18*scale,9.6,zbase-.02*scale,
                         .58*scale,.12*scale,.16*scale,side*32,"antler")
                  rod_xy(ax+side*.28*scale,9.88,zbase-.02*scale,
                         .44*scale,.1*scale,.14*scale,-side*28,"antler")
                  b((ax+side*.34*scale,9.63,zbase-.1*scale),
                    (ax+side*.47*scale,9.98,zbase+.08*scale),"antler")
                  b((ax+side*.51*scale,9.88,zbase-.1*scale),
                    (ax+side*.63*scale,10.16,zbase+.08*scale),"antler")
              # tiny gold chest tag
              b((cx-.1*scale,8.03,zbase-.24*scale),(cx+.1*scale,8.22,zbase-.06*scale),"gold")

          reindeer(9.0,7.5,1.0)
          reindeer(12.0,8.25,.92)

          # Wrapped parcels and tiny ornaments on the snowy display floor.
          for xx,zz,mat,size in ((6.1,10.7,"gift",.78),(7.0,10.1,"tree",.68),
                                 (10.2,11.0,"gift",.7),(11.1,10.4,"gift",.55)):
              box((xx,6.62,zz),(xx+size,7.25,zz+size),mat)
              box((xx+size*.42,6.62,zz-.04),(xx+size*.58,7.3,zz+size+.04),"gold")
              box((xx+.2,7.22,zz+.2),(xx+size-.2,7.47,zz+size-.2),"bow")

          # Hanging red baubles with gold caps on the outside front corners.
          for xx in (1.05,14.1):
              box((xx,8.8,.2),(xx+.25,9.55,.48),"gold")
              box((xx-.28,7.85,.1),(xx+.52,8.78,.72),"bow")
              box((xx-.18,8.1,.02),(xx+.42,8.62,.82),"velvet")
              box((xx-.12,8.7,.18),(xx+.36,8.84,.62),"gold")
          # Matching ornaments and gold hooks on the side flanks.
          for sx in (.02,15.55):
              for zz in (4.0,8.0,12.0):
                  box((sx,8.9,zz),(sx+.35,9.48,zz+.28),"gold")
                  box((sx,8.15,zz-.3),(sx+.4,8.88,zz+.58),"bow")
                  box((sx-.03,8.28,zz-.2),(sx+.45,8.72,zz+.48),"velvet")
                  box((sx,8.7,zz-.1),(sx+.36,8.84,zz+.38),"gold")

          # Red gable trim and the roof: stepped pitched panels with snowy voxel caps.
          # Left and right roof slopes rise towards a central ridge.
          roof_steps = [
              (0.00,2.15,12.72),(1.85,4.15,13.20),(3.85,6.15,13.68),
              (5.85,8.12,14.16),(7.88,10.15,14.16),(9.85,12.15,13.68),
              (11.85,14.15,13.20),(13.85,16.00,12.72)
          ]
          for x1,x2,yy in roof_steps:
              box((x1,yy,.28),(x2,yy+.84,15.72),"roof")
              # Red overhanging fascia on front and rear edges.
              box((x1,yy+.25,.18),(x2,yy+.83,.56),"velvet")
              box((x1,yy+.25,15.44),(x2,yy+.83,15.82),"velvet")
              # snow sitting as staggered patches on the roof surface
              if int(x1*10)%3 != 1:
                  box((x1+.08,yy+.82,.56),(min(x2,x1+.88),yy+1.02,2.1),"snow")
              if int(x1*10)%2 == 0:
                  box((x1+.65,yy+.82,12.8),(min(x2,x1+1.42),yy+1.02,15.42),"snow")
          # Bright ridge cap and snowy eave strips.
          box((7.56,15.02,.15),(8.44,15.58,15.85),"velvet")
          box((7.4,15.48,.12),(8.6,15.76,15.88),"snow")
          box((.05,13.2,.14),(.62,13.66,15.86),"snow")
          box((15.38,13.2,.14),(15.95,13.66,15.86),"snow")
          # Side roof edging, layered snow blocks and golden brackets.
          for zz in (1.0,4.0,7.0,10.0,13.0):
              box((.02,13.25,zz),(.58,13.72,zz+1.05),"snow")
              box((15.42,13.25,zz),(15.98,13.72,zz+1.05),"snow")
          for sx in (.35,15.4):
              box((sx,12.35,1.0),(sx+.3,13.35,15.0),"gold")

          # Decorative front and side eave garlands just below the roofline.
          box((.7,12.45,.14),(15.3,12.82,.68),"fir")
          for i in range(19):
              xx=1.0+i*.78
              box((xx,12.25,.05),(xx+.56,12.73,.63),"fir")
              if i%3==0:
                  box((xx+.12,12.2,.02),(xx+.34,12.48,.4),"bow")
          bow_front(8,12.95,.02,.62)
          for sx in (.2,15.66):
              box((sx,12.4,1.0),(sx+.35,12.82,15.0),"fir")
              side_bow(sx,12.9,8,.58,"left" if sx<1 else "right")

          # Gold decorative corners, rivets and snow flecks finish the voxel surfaces.
          for xx in (1.2,14.3):
              for yy in (1.45,4.55,5.8,12.1):
                  box((xx,yy,.16),(xx+.34,yy+.22,.42),"gold")
          for xx,zz in ((2.0,2.2),(4.1,3.1),(12.1,2.0),(13.9,4.1),
                        (2.0,12.8),(13.7,12.3),(7.1,2.6),(9.2,3.0)):
              box((xx,11.9,zz),(xx+.12,12.08,zz+.12),"snow")

          model = {
              "textures": {
                  "atlas":"minecraft:custom/maumod/mausmp/weihnachtskiste",
                  "particle":"minecraft:custom/maumod/mausmp/weihnachtskiste"
              },
              "elements": elements,
              "display": {
                  "gui":{"rotation":[25,225,0],"translation":[0,0,0],"scale":[0.63,0.63,0.63]},
                  "ground":{"rotation":[0,0,0],"translation":[0,2,0],"scale":[0.55,0.55,0.55]},
                  "fixed":{"rotation":[0,0,0],"translation":[0,0,0],"scale":[0.58,0.58,0.58]},
                  "firstperson_righthand":{"rotation":[0,135,0],"translation":[0,2,0],"scale":[0.46,0.46,0.46]},
                  "firstperson_lefthand":{"rotation":[0,135,0],"translation":[0,2,0],"scale":[0.46,0.46,0.46]},
                  "thirdperson_righthand":{"rotation":[75,45,0],"translation":[0,2.5,0],"scale":[0.42,0.42,0.42]},
                  "thirdperson_lefthand":{"rotation":[75,45,0],"translation":[0,2.5,0],"scale":[0.42,0.42,0.42]}
              }
          }
          if len(elements) < 250:
              raise SystemExit(f"Model does not meet the expected detail count: {len(elements)}")
          model_path.write_text(json.dumps(model,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if Image.open(texture_path).size != (512,512):
              raise SystemExit("Christmas atlas is not 512x512.")

          # Update only the Christmas crate model and texture entries in the existing ZIP.
          if not archive_path.is_file():
              raise SystemExit(f"Existing server ZIP is missing: {archive_path}")
          replacements = {
              model_path.as_posix(): model_path.read_bytes(),
              texture_path.as_posix(): texture_path.read_bytes()
          }
          with tempfile.TemporaryDirectory() as temp_name:
              temp = Path(temp_name)
              old_zip, new_zip = temp/"old.zip", temp/"new.zip"
              shutil.copy2(archive_path, old_zip)
              with zipfile.ZipFile(old_zip,"r") as zin:
                  bad=zin.testzip()
                  if bad:
                      raise SystemExit(f"Old server ZIP CRC error: {bad}")
                  old_names=set(zin.namelist())
                  for required in ("pack.mcmeta","assets/minecraft/items/chest.json",
                                   "assets/minecraft/models/custom/maumod/maublitztruhe/double_chest.json"):
                      if required not in old_names:
                          raise SystemExit(f"Existing ZIP is missing protected file: {required}")
                  with zipfile.ZipFile(new_zip,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zout:
                      for info in zin.infolist():
                          if info.filename in replacements:
                              continue
                          zout.writestr(info,zin.read(info.filename))
                      for name,data in replacements.items():
                          zout.writestr(name,data)
              with zipfile.ZipFile(new_zip,"r") as check:
                  bad=check.testzip()
                  if bad:
                      raise SystemExit(f"New server ZIP CRC error: {bad}")
                  names=set(check.namelist())
                  if not set(replacements).issubset(names):
                      raise SystemExit("New Christmas model/texture missing from ZIP.")
                  if "pack.mcmeta" not in names:
                      raise SystemExit("pack.mcmeta was not preserved.")
                  if "assets/minecraft/models/custom/maumod/maublitztruhe/double_chest.json" not in names:
                      raise SystemExit("Blitztruhe model was not preserved.")
                  if "assets/minecraft/textures/custom/maumod/maublitztruhe/front.png" not in names:
                      raise SystemExit("Blitztruhe front texture was not preserved.")
              new_zip.replace(archive_path)

          # Keep the CMD mapping unchanged; explicitly verify the Christmas entry.
          with zipfile.ZipFile(archive_path,"r") as z:
              chest=json.loads(z.read("assets/minecraft/items/chest.json").decode("utf-8"))
              entries=chest.get("model",{}).get("entries",[])
              if not any(e.get("threshold")==2000003 and
                         e.get("model",{}).get("model")=="minecraft:custom/maumod/mausmp/weihnachtskiste"
                         for e in entries):
                  raise SystemExit("Christmas crate CMD 2000003 mapping changed unexpectedly.")
              if not any(e.get("threshold")==2000002 and
                         e.get("model",{}).get("model")=="minecraft:custom/maumod/maublitztruhe/double_chest"
                         for e in entries):
                  raise SystemExit("Blitztruhe CMD 2000002 mapping changed unexpectedly.")

          print(f"Created Christmas showcase model with {len(elements)} separate voxel elements.")
          print("Generated custom 512x512 Christmas texture atlas.")
          print("Updated only Weihnachtskiste model/texture inside the existing server ZIP.")
          print("Verified both CMD routes, Blitztruhe model/texture, pack.mcmeta and ZIP CRC.")
          PY
      - name: Commit Christmas crate and refreshed server ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/update-christmas-showcase.yml
          git add assets/minecraft/models/custom/maumod/mausmp/weihnachtskiste.json
          git add assets/minecraft/textures/custom/maumod/mausmp/weihnachtskiste.png
          git add MAU_Spezialpapier_CMD_1001_1.21.11.zip
          git commit -m "Rebuild Christmas crate as detailed voxel showcase"
          git push origin HEAD:main
