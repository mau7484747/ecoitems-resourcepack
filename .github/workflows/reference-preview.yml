name: Temporary reference image preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-preview.yml"

permissions:
  contents: write

jobs:
  preview:
    if: contains(github.event.head_commit.message, '[preview-ref]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create small readable preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import base64
          source = Path("ChatGPT-Bild 20. Nov. 2026, 22_51_28.png")
          image = Image.open(source).convert("RGB")
          image = ImageOps.contain(image, (640, 640), method=Image.Resampling.LANCZOS)
          preview = Path("/tmp/reference-preview.jpg")
          image.save(preview, "JPEG", quality=48, optimize=True, progressive=True)
          encoded = base64.b64encode(preview.read_bytes()).decode("ascii")
          Path("__temporary_reference_preview.b64").write_text(encoded, encoding="ascii")
          print(f"Preview dimensions: {image.width}x{image.height}; bytes: {preview.stat().st_size}")
          PY
      - name: Commit temporary preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __temporary_reference_preview.b64
          git commit -m "Create temporary reference image preview"
          git push origin HEAD:main
