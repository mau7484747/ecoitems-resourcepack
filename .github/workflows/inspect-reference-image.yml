name: Export Christmas crate screenshot preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-reference-image.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare compressed screenshot preview
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys

          source = Path("Screenshot 2026-11-21 104224.png")
          if not source.is_file():
              raise SystemExit("Reference screenshot not found in repository.")
          image = Image.open(source).convert("RGB")
          image.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
          out = Path("preview")
          out.mkdir(exist_ok=True)
          image.save(out / "reference-preview.jpg", "JPEG", quality=88, optimize=True)
          print(f"Original: {Image.open(source).size}; preview: {image.size}")
          PY
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: christmas-crate-reference-preview
          path: preview/reference-preview.jpg
          if-no-files-found: error
          retention-days: 1
